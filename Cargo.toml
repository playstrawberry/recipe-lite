[package]
name = "recipe-lite"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Strawberry-Source-Available-1.0"
publish = false
authors = ["Strawberry Interactive LLC"]
description = "Recipes: /recipe shows how an item is made, in a crafting, furnace, stonecutter or smithing window nothing can be taken from."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sp-lang = { path = "libs/sp-lang" }
strawberry-plugin-api = { version = "=0.2.3", registry = "strawberry" }

# A repository of its own, not a member of a larger workspace.
[workspace]
members = ["libs/sp-lang"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
